app:
  # This is a pure AMQP microservice (main.ts calls app.init(), not app.listen()), so `port`/`host`
  # are unused — kept only to satisfy AppConfig. The service is reachable over the broker, not HTTP.
  port: 3001
  host: 0.0.0.0
  environment: "development"

auth-providers: []

broker:
  name: "rabbitmq"
  # Point this at your RabbitMQ instance (vhost included after the last slash).
  # guest/guest only authenticates from localhost — replace for any remote broker.
  uri: "amqp://localhost:5672/"
  defaultSubscribeErrorBehavior: "ack"
  defaultPublishErrorBehavior: "reject"
  # Route auto-discovery (publisher side) lives INSIDE the broker block.
  # `serviceName` is BOTH the ownership key a gateway uses to group/replace this microservice's
  # routes AND — because no clientProperties.connection_name is set below — the AMQP connection_name
  # (BrokerModule promotes serviceName → connection_name when none is set explicitly).
  # `publishOnBoot: true` announces every @BrokerHTTP route to the gateway fan-out exchange at boot.
  routeDiscovery:
    serviceName: calculator.ms
    publishOnBoot: true
  connectionManagerOptions:
    heartbeatIntervalInSeconds: 60
    reconnectTimeInSeconds: 60
    connectionOptions:
      credentials:
        mechanism: PLAIN
        username: guest
        password: guest
  exchanges:
    - name: calculator
      type: "direct"
      createExchangeIfNotExists: true
      options:
        durable: true
        autoDelete: false
        internal: false
  queues:
    - name: calculator
      createQueueIfNotExists: true
      exchange: calculator
      routingKey: calculator
      options:
        durable: true
        autoDelete: false
        exclusive: false

topics:
  # The @BrokerAction("calculator", ...) handlers in AppService bind to this RPC topic.
  - name: calculator
    exchange: calculator
    routingKey: "calculator"
    mode: rpc
