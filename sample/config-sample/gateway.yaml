# =============================================================================
# @open-rlb/nestjs-amqp — GATEWAY reference (HTTP + WebSocket proxy)
# =============================================================================
# This file documents the two top-level blocks that configure the gateway:
#
#   gateway:         the HTTP/WebSocket proxy (ProxyModule / GatewayConfig)
#   auth-providers:  named token validators referenced by paths and events
#
# It is a REFERENCE: every field is commented and every value is a safe
# placeholder. Copy the pieces you need into your real config.yaml.
#
# The gateway turns broker actions into a public surface: it maps HTTP routes
# to a broker topic/action (forwarding the call and relaying the reply) and
# fans broker events out to WebSocket clients.
#
# NAMING RULES — read before changing anything:
#   * Topic NAMES (rlb-acl, rlb-gateway-admin, rlb-gateway-control) and ACTION
#     strings (acl-action-update, gw-path-export, gw-reload, gw-metrics-track,
#     ...) are DECORATOR-BOUND on the backend handlers and are NOT configurable.
#     They must match the @BrokerAction decorators exactly.
#   * What IS configurable: exchange / queue / routingKey on the broker side,
#     and the route-discovery exchange/queue (broker.routeDiscovery) — none of
#     which appear in this file; see the broker reference for those.
# =============================================================================


# -----------------------------------------------------------------------------
# auth-providers:  HandlerAuthConfig[]  (top-level, NOT under gateway)
# -----------------------------------------------------------------------------
# A named list of token validators. A gateway path references one by name via
# `auth:`; a WebSocket event references one via its own `auth:`. Each provider
# both VALIDATES the incoming token and MAPS its claims into forwarded headers.
#
# type values:
#   jwt          verify a Bearer JWT with a shared HS secret (`secret`)
#   jwks         verify a Bearer JWT against a JWKS endpoint (`jwksUri`)
#   basic        verify HTTP Basic against clientId/clientSecret
#   str-compare  compare the raw Authorization header to `secret`
#   none         no validation
#
# NOTE: `usernameClaim` is deprecated and intentionally omitted here.
auth-providers:
  # ---- one fully-commented JWKS provider (e.g. Keycloak / OIDC) -------------
  - name: gateway-jwks               # referenced by path.auth / event.auth
    type: jwks                       # verify Bearer JWT against a JWKS endpoint

    # Prefix for the claim headers this provider injects downstream. Mapped
    # claims become <headerPrefix><DEST>; the user id becomes <headerPrefix>USERID.
    # Request headers can NEVER override these (anti-spoofing).
    headerPrefix: "X-GTW-AUTH-"

    # Claim that becomes the user-id header (<headerPrefix>USERID). REQUIRED for
    # any path/event that declares `actions` — the action check resolves identity
    # from this claim.
    uidClaim: sub

    # Claim → forwarded-header mapping, as 'source:dest' pairs. Each decoded
    # claim <source> is exposed as <headerPrefix><DEST>.
    # WITHOUT jwtMap the token is accepted but NO claims are forwarded.
    jwtMap:
      - sub:userId                   # -> X-GTW-AUTH-USERID
      - email:email                  # -> X-GTW-AUTH-EMAIL
      - preferred_username:username  # -> X-GTW-AUTH-USERNAME
      - roles:roles                  # -> X-GTW-AUTH-ROLES

    # Allowed signing algorithms for the JWT.
    algorithms:
      - RS256

    # Expected token issuer (must match the `iss` claim).
    issuer: https://auth.example.com/realms/demo

    # JWKS endpoint used for signing-key discovery (jwks type).
    jwksUri: https://auth.example.com/realms/demo/protocol/openid-connect/certs

    # --- optional extras (validate against your IdP / leave unset) ---
    # audience: my-api                  # expected `aud` claim, if you enforce it
    # tokenUrl: https://auth.example.com/realms/demo/protocol/openid-connect/token
    # clientId: demo-client
    # clientSecret: REPLACE_ME          # used by `basic` type as the password
    # httpsAllowUnauthorized: false     # accept self-signed TLS on jwksUri (dev only)
    # scopes:                           # OIDC scopes, when fetching tokens
    #   - openid
    #   - profile

  # ---- other provider shapes, for reference (uncomment / adapt) -------------
  # HS256-signed JWT verified with a shared secret:
  # - name: gateway-hs
  #   type: jwt
  #   headerPrefix: "X-GTW-AUTH-"
  #   uidClaim: sub
  #   secret: REPLACE_ME               # HS shared secret
  #   algorithms: [HS256]
  #   issuer: https://auth.example.com/realms/demo
  #   jwtMap:
  #     - sub:userId
  #
  # HTTP Basic (clientId = username, clientSecret = password). A `basic`
  # provider WITHOUT clientSecret passes through as authenticated (open):
  # - name: gateway-basic
  #   type: basic
  #   headerPrefix: "X-GTW-AUTH-"
  #   clientId: demo-user
  #   clientSecret: REPLACE_ME
  #
  # str-compare: the raw Authorization header is compared to `secret` and
  # mapped to <prefix>TOKEN. Without `secret` it passes through:
  # - name: gateway-token
  #   type: str-compare
  #   headerPrefix: "X-GTW-AUTH-"
  #   secret: REPLACE_ME


# -----------------------------------------------------------------------------
# gateway:  GatewayConfig
# -----------------------------------------------------------------------------
gateway:
  # Operating mode of this app instance. The gateway runs as a proxy.
  mode: gateway

  # Prefix applied to FORWARDED REQUEST headers (the `forwardHeaders` map on a
  # path). NOTE: this is separate from a provider's `headerPrefix`, which
  # governs the auth-claim headers.
  headerPrefix: "X-FWD-"

  # ===========================================================================
  # paths:  PathDefinition[]   — HTTP routes
  # ===========================================================================
  # Each entry maps an HTTP method+path to a broker topic/action.
  #
  # THE AUTH GATE (evaluated per request):
  #   1. allowAnonymous: true        -> gate skipped; a valid token (if present)
  #                                     still has claims mapped & forwarded.
  #   2. auth set, no actions        -> authentication only (401 if invalid).
  #   3. auth + actions              -> authenticate, resolve the caller's userId,
  #                                     extract the request's (companyId, resourceId),
  #                                     then checkAction(userId, ctx, actions): pass
  #                                     if the user holds AT LEAST ONE action on that
  #                                     (companyId, resourceId), else 403.
  #   Declaring `actions` WITHOUT `auth` fails closed (every request 403).
  #
  #   The gateway reads the canonical companyId/resourceId from the request
  #   (precedence params → query → body) and matches them exactly.
  #
  # RESPONSE / STATUS MAPPING (rpc mode):
  #   * A DEFINED reply (including falsy false / 0 / "") -> 200 with body.
  #   * null / undefined                                 -> 204 No Content.
  #     (So a boolean-check route returns 200 with body `false`, NOT 204.)
  #   Broker error `name` -> HTTP status:
  #     BadRequestError / InvalidParamsErrror -> 400
  #     UnauthorizedError                     -> 401
  #     ForbiddenError                        -> 403
  #     NotFoundError                         -> 404
  #     ConflictError                         -> 409
  #     (anything else)                       -> 500
  # RESPONSE / STATUS MAPPING (event mode):
  #   * successful publish -> successStatusCode || 202
  #   * publish failure    -> 503
  #
  # dataSource — how the forwarded payload is assembled (req.params always merged):
  #   body         { ...params, ...body }
  #   query        { ...params, ...query }
  #   params       { ...params }
  #   body-query   { ...params, ...query, ...body }   (body wins)
  #   query-body   { ...params, ...body, ...query }   (query wins)
  paths:

    # ---- (1) Minimal public RPC route ---------------------------------------
    # GET /health -> rlb-gateway-admin / gw-health, no auth.
    - name: health                 # logical name (logs + metrics)
      method: GET                  # HTTP verb
      path: /health               # Express path (may include :params)
      dataSource: query           # forward the query string as the payload
      topic: rlb-gateway-admin    # DECORATOR-BOUND topic name (not configurable)
      action: gw-health           # DECORATOR-BOUND action string (not configurable)
      mode: rpc                   # wait for the broker reply and relay it

    # ---- (2) Rich RPC route exercising every PathDefinition field -----------
    # GET /reports/:id -> rlb-gateway-admin / gw-metrics-get.
    # Authenticated + action-gated, with header forwarding, custom timeout, etc.
    - name: report-download
      method: GET
      path: /reports/:id          # :id is merged into the payload via params
      dataSource: query-body      # query wins over body wins over... (params always)
      topic: rlb-gateway-admin
      action: gw-metrics-get
      mode: rpc

      auth: gateway-jwks          # provider name from auth-providers above
      actions: [metrics-read]     # caller must hold at least ONE of these ACTIONS on
                                  # the request's (companyId, resourceId)
      allowAnonymous: false       # explicit: do NOT skip the gate (default behavior)

      # The gateway reads the canonical companyId/resourceId from the request
      # (precedence params → query → body) and matches them exactly.

      timeout: 15000              # RPC timeout in ms (rpc mode only)

      # Treat a raw (non-JSON) RPC reply as base64 and emit it as a binary body
      # (e.g. a generated PDF/image). Pairs with successStatusCode/headers.
      binary: true

      # Override the success status. Default is 200 (rpc) / 202 (event) /
      # 204 (empty rpc reply). Here we keep an explicit 200.
      successStatusCode: 200

      # Static response headers added to every reply on this route.
      headers:
        Cache-Control: no-store
        X-Report-Kind: metrics

      # Copy named REQUEST headers downstream to the microservice. Each entry is
      # <destHeader>: <sourceHeader>; the dest is prefixed by gateway.headerPrefix.
      # Here request header `X-Request-Id` is forwarded as `X-FWD-X-Trace-Id`.
      forwardHeaders:
        X-Trace-Id: X-Request-Id

    # ---- (3) Event route (fire-and-forget) with raw body + redirect ---------
    # POST /webhooks/ingest -> rlb-gateway-admin / gw-metrics-track (event mode).
    # `event` mode does not wait for a reply; a successful publish returns 202
    # (or successStatusCode), a publish failure returns 503.
    - name: webhook-ingest
      method: POST
      path: /webhooks/ingest
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-metrics-track    # DECORATOR-BOUND action string (not configurable)
      mode: event

      allowAnonymous: true        # public route: skip the auth/role gate

      # Expose the raw, unparsed request body to the handler as `$raw`.
      # REQUIRES the app to bootstrap with NestFactory.create(AppModule,{rawBody:true}).
      parseRaw: true

      # Status returned on a successful publish (overrides the 202 default).
      successStatusCode: 204

      # `redirect` is meaningful on rpc routes: when set, the gateway issues an
      # HTTP redirect with this status using the reply as the Location. Shown
      # here only as a field reference (it has no effect in event mode):
      # redirect: 302

  # ===========================================================================
  # loadConfig:  DB-backed routes / events merged with the YAML ones above
  # ===========================================================================
  # On (re)load the gateway RPCs these topic/action pairs to pull routes stored
  # in a database, then merges them with the static `paths` / `events`. Seed via
  # the admin CRUD routes, then trigger a reload (see reloadTopic).
  # topic/action below are DECORATOR-BOUND (gateway-admin handlers).
  loadConfig:
    paths:
      topic: rlb-gateway-admin
      action: gw-path-export      # RPC that exports DB-stored HTTP routes
    # Optional: pull DB-stored WebSocket events on boot too.
    # events:
    #   topic: rlb-gateway-admin
    #   action: gw-event-export

  # ===========================================================================
  # reloadTopic:  runtime route rebuild
  # ===========================================================================
  # Broadcast control topic the gateway subscribes to. A message carrying the
  # action `gw-reload` (the literal string GW_RELOAD_ACTION — NOT configurable)
  # rebuilds the route table at runtime without a restart. Use a `broadcast`
  # topic so EVERY gateway instance reloads. The topic NAME below maps to a
  # configurable broker topic, but the trigger action `gw-reload` does not.
  reloadTopic: rlb-gateway-control

  # ===========================================================================
  # metrics:  per-call metrics sink
  # ===========================================================================
  # When set, the gateway fires a fire-and-forget track event after EVERY served
  # HTTP request (method/route/name/status/durationMs). Point it at the
  # gateway-admin metrics handler. Omit the whole block to disable.
  # topic/action are DECORATOR-BOUND (not configurable).
  metrics:
    topic: rlb-gateway-admin
    action: gw-metrics-track

  # ===========================================================================
  # ws:  WebSocketGatewayOptions — connection-level limits & heartbeat
  # ===========================================================================
  # CONNECTION-level only. Authentication/authorization is declared PER-EVENT
  # (auth/requireAuth/actions/scopeClaim under each events[] entry), not here.
  ws:
    maxConnections: 1000             # max concurrent connections this instance accepts
    maxSubscriptionsPerClient: 50    # max active subscriptions per connected client
    heartbeatIntervalMs: 30000       # ping/pong interval (default 30000); also drops
                                     # dead sockets and expired-token sessions
    maxMessageBytes: 16384           # max inbound client message size in bytes
                                     # (default 16384); larger frames are dropped
    maxBufferedBytes: 1048576        # outbound backpressure cap (default 1 MiB): a slow
                                     # client whose send buffer exceeds this gets its event
                                     # messages DROPPED until it drains (no unbounded RAM)
    allowedOrigins:                  # accepted Origin headers for the WS handshake;
      - https://app.example.com      # when omitted, ALL origins are accepted (logged)

  # ===========================================================================
  # events:  WebSocketEvent[] — broker exchange -> client stream / webhook
  # ===========================================================================
  # Each event binds a broker exchange/routingKey to a named client-facing
  # event. Clients subscribe by `name`; messages arrive as `on<Name>` (the name
  # with its first letter capitalized, e.g. chat -> onChat).
  #
  # type:
  #   ws    a client-facing WebSocket stream
  #   mqtt  (reserved)
  #   http  forward each broker message to a webhook (url/method/headers/timeout)
  #
  # The exchange / routingKey here ARE configurable broker coordinates.
  events:

    # ---- (a) Authenticated, per-user-scoped WS stream -----------------------
    - name: chat                     # clients subscribe to "chat"; receive "onChat"
      type: ws
      exchange: rlb                  # broker exchange to bind (configurable)
      routingKey: chat.messages      # routing key for this stream (configurable)

      auth: gateway-jwks             # verify the connection token at subscribe time
      requireAuth: true              # require a valid token (default true when auth set);
                                     # set false to allow anonymous subscribers while
                                     # still mapping claims for authenticated ones
      actions: [chat-subscribe]      # action check via the ACL service (needs auth);
                                     # WS events are gated resource-agnostically

      # Per-user isolation: the server only forwards a message when
      # payload[payloadKey] equals the authenticated client's scopeClaim value.
      # Prevents a client from receiving other users' data via a crafted filter.
      scopeClaim: userId             # claim taken from the verified token
      payloadKey: userId             # key compared against it inside the message

    # ---- (b) Webhook (http-type) event --------------------------------------
    # Forwards each broker message to an external HTTP endpoint instead of to
    # WS clients. The url/method/headers/timeout fields apply to http events.
    - name: order-events
      type: http
      exchange: rlb
      routingKey: orders.created
      url: https://hooks.example.com/orders   # webhook target (REPLACE_ME)
      method: POST
      headers:
        Authorization: "Bearer REPLACE_ME"
        Content-Type: application/json
      timeout: 5000                  # webhook request timeout in ms
