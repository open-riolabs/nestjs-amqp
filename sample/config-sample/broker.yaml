# =============================================================================
# broker.yaml — REFERENCE template for @open-rlb/nestjs-amqp
# =============================================================================
# A heavily-annotated reference of the `broker:` (RabbitMQConfig) and `topics:`
# (BrokerTopic[]) blocks, with EVERY option documented (purpose + default).
#
# This is a TEMPLATE, not a runnable config for one specific app — it shows the
# full surface area in one place. Copy the pieces you need and delete the rest;
# a real service only declares the exchanges/queues/topics it actually uses
# (see the runnable examples under calculator.ms/ and gateway-in-memory/).
#
# These two blocks map to the first two arguments of
#   BrokerModule.forRoot(broker, topics, app?)
#
# Conventions used in this file:
#   - amqp://localhost:5672/           placeholder broker URI (vhost after the
#                                      last slash; empty here = default vhost)
#   - https://auth.example.com/...     placeholder issuer/JWKS (not used here)
#   - REPLACE_ME                       any environment-specific value
#
# WHAT IS / ISN'T CONFIGURABLE
#   - Topic NAMES (e.g. rlb-acl, rlb-gateway-admin, rlb-gateway-control) are
#     DECORATOR-BOUND constants in the library — they are NOT free to rename.
#     If you consume those built-in modules, the `topics[].name` MUST match the
#     constant the decorators use. For your OWN topics you choose the name.
#   - ACTION strings (e.g. acl-action-update, gw-path-export, gw-reload) are
#     likewise decorator-bound on @BrokerAction and NOT configurable here.
#   - exchange / queue / routingKey, and the route-discovery exchange/queue, ARE
#     configurable — pick whatever names suit your broker/topology.
# =============================================================================

broker:
  # ---------------------------------------------------------------------------
  # name — free-form label for the connection (cosmetic). Optional.
  # ---------------------------------------------------------------------------
  name: "rabbitmq"

  # ---------------------------------------------------------------------------
  # uri — AMQP connection URI. REQUIRED.
  # Everything after the last "/" is the vhost (empty => default vhost "/").
  # guest/guest only authenticates from localhost — use real credentials (below)
  # for any remote broker.
  # ---------------------------------------------------------------------------
  uri: "amqp://localhost:5672/"

  # ---------------------------------------------------------------------------
  # retry — bounded retry policy on handler failure (consumer/decorator path).
  # Replaces the legacy infinite nack-requeue: a failing message is re-published
  # up to maxAttempts times (with x-retry-count header), optionally after
  # delayMs (via a TTL wait-queue `<queue>.retry.<delayMs>`), then dead-lettered
  # or dropped. An exhausted RPC message also sends an error reply so the caller
  # fails fast (the gateway maps it to HTTP 502) instead of burning its timeout.
  # Deserialization failures (poison, can never become valid) skip retries.
  # Per-topic override: topics[].retry. Built-in default when neither retry nor
  # a legacy errorBehavior is configured: 5 attempts, no delay, then drop.
  # NOTE: deadLetter.exchange must be declared in broker.exchanges.
  # ---------------------------------------------------------------------------
  retry:
    maxAttempts: 5            # total attempts, including the first delivery
    delayMs: 5000             # wait between attempts (0 = immediate)
    onExhausted: dead-letter  # dead-letter | drop (default: dead-letter if deadLetter set, else drop)
    deadLetter:
      exchange: rlb-dlx       # declare it in broker.exchanges!
      # routingKey: my-key    # default: the message's original routing key

  # ---------------------------------------------------------------------------
  # defaultSubscribeErrorBehavior — LEGACY alternative to `retry`: what the
  # connection does when a SUBSCRIBE handler throws (the consumer/decorator
  # path). One of: ack | nack | requeue.
  # "ack"  => swallow the failed message (don't redeliver).
  # Takes effect only when `retry` is not configured (the `retry` block above
  # wins). Per-topic override: topics[].errorBehavior. Prefer `retry`.
  # ---------------------------------------------------------------------------
  # defaultSubscribeErrorBehavior: "ack"

  # ---------------------------------------------------------------------------
  # defaultPublishErrorBehavior — behavior when a publish is rejected.
  # "reject" surfaces the failure to the caller (publisher confirms reject on
  # nack). Mirrors the samples.
  # ---------------------------------------------------------------------------
  defaultPublishErrorBehavior: "reject"

  # ---------------------------------------------------------------------------
  # prefetchCount — DEFAULT channel prefetch (max unacked messages in flight per
  # channel). Tunes throughput vs. fairness across handlers. Optional; if unset
  # the connection-manager default applies. Per-channel overrides exist via the
  # `channels` map (not shown here).
  # ---------------------------------------------------------------------------
  prefetchCount: 10

  # ---------------------------------------------------------------------------
  # defaultRpcTimeout — default RPC wait in ms before requestData() rejects.
  # Resolution order at call time: explicit arg -> topic -> this -> 10000.
  # Optional.
  # ---------------------------------------------------------------------------
  defaultRpcTimeout: 10000

  # ---------------------------------------------------------------------------
  # routeDiscovery — PUBLISHER-side route auto-discovery. OPTIONAL.
  # A microservice announces its @BrokerHTTP routes to the gateway over AMQP.
  # It lives INSIDE the broker block (broker.routeDiscovery) so a microservice's
  # whole identity is configured in one place.
  #
  # NOTE: the GATEWAY (the CONSUMER of route manifests) does NOT use this — it
  # configures its side via GatewayAdminModule. Only publishing microservices
  # set broker.routeDiscovery.
  # ---------------------------------------------------------------------------
  routeDiscovery:
    # serviceName — ownership key the gateway uses to group/replace THIS
    # service's routes. ALSO promotes to the AMQP connection_name when no
    # explicit clientProperties.connection_name is set below (an explicit
    # connection_name always wins). Required to actually publish.
    serviceName: REPLACE_ME-service

    # publishOnBoot — announce the route manifest automatically at bootstrap.
    # Default: true.
    publishOnBoot: true

    # exchange — fanout exchange the manifests are published to. Default:
    # "rlb-route-discovery". CONFIGURABLE, but the SAME value must be set on the
    # gateway side (override only to namespace route-discovery per env/cluster).
    exchange: rlb-route-discovery

    # queue — durable shared work-queue the gateway(s) consume manifests from
    # (competing consumers). Default: "rlb-route-sync". Must match the gateway.
    queue: rlb-route-sync

  # ---------------------------------------------------------------------------
  # connectionManagerOptions — passed to amqp-connection-manager. OPTIONAL.
  # Holds heartbeat/reconnect cadence and the underlying amqplib connectionOptions
  # (credentials + clientProperties.connection_name).
  # ---------------------------------------------------------------------------
  connectionManagerOptions:
    # heartbeatIntervalInSeconds — AMQP heartbeat. 0 disables. Common: 60.
    heartbeatIntervalInSeconds: 60
    # reconnectTimeInSeconds — delay between reconnect attempts after a drop.
    reconnectTimeInSeconds: 60

    connectionOptions:
      # clientProperties.connection_name — the name this connection shows up as
      # in the RabbitMQ management UI. IMPORTANT for `broadcast` topics: the
      # per-instance broadcast queue is `${topic}-${connection_name}`, so every
      # instance MUST have a DISTINCT connection_name (the broker throws on boot
      # if a broadcast topic is declared and connection_name is missing).
      # If omitted, routeDiscovery.serviceName is promoted to connection_name.
      clientProperties:
        connection_name: "REPLACE_ME-instance-1"

      # credentials — used when the URI doesn't carry user:pass, or to pick a
      # specific SASL mechanism. Replace guest/guest for any remote broker.
      credentials:
        mechanism: PLAIN
        username: REPLACE_ME
        password: REPLACE_ME

  # ---------------------------------------------------------------------------
  # connectionInitOptions — whether to BLOCK on a healthy connection at boot.
  # OPTIONAL. Defaults: wait=true, timeout=5000 (ms), reject=true.
  # ---------------------------------------------------------------------------
  connectionInitOptions:
    wait: true        # block until connected (or timeout)
    timeout: 5000     # ms to wait for a healthy connection
    reject: true      # throw on timeout (false => continue, treat as non-fatal)

  # ---------------------------------------------------------------------------
  # exchanges — exchanges to assert on connect. OPTIONAL (but you need at least
  # one to route messages). Each entry:
  #   name                       exchange name (CONFIGURABLE).
  #   type                       direct | topic | fanout | headers.
  #   createExchangeIfNotExists  assert it if missing (true) vs. assume present.
  #   options                    amqplib AssertExchange options.
  #     durable    survive a broker restart (recommended true).
  #     autoDelete delete when the last queue unbinds.
  #     internal   not publishable to directly by clients.
  # ---------------------------------------------------------------------------
  exchanges:
    - name: rlb
      type: direct
      createExchangeIfNotExists: true
      options:
        durable: true
        autoDelete: false
        internal: false
    # Dead-letter exchange used by broker.retry above. Keep it DEDICATED: if a work
    # queue is (or becomes) bound to it, exhausted messages route straight back into
    # the queue they just left and loop forever — the dead-letter copy keeps the
    # message's ORIGINAL routing key unless `deadLetter.routingKey` says otherwise.
    # The `rlb-dead-letters` queue below is bound to it: without a binding the broker
    # discards every dead-lettered message and `onExhausted: dead-letter` silently
    # degrades to `drop`.
    - name: rlb-dlx
      type: topic
      createExchangeIfNotExists: true
      options:
        durable: true

  # ---------------------------------------------------------------------------
  # queues — queues to assert and bind on connect. OPTIONAL. Each entry:
  #   name                    queue name (CONFIGURABLE).
  #   exchange                exchange to bind to (must exist / be declared above).
  #   routingKey              binding/routing key (direct exchange => exact match).
  #   createQueueIfNotExists  assert it if missing.
  #   options                 amqplib AssertQueue options.
  #     durable    survive a broker restart (pairs with persistent publishes).
  #     autoDelete delete when the last consumer disconnects.
  #     exclusive  restrict to the declaring connection.
  # NOTE: do NOT declare the per-instance queue for a `broadcast` topic here —
  # the broker asserts `${topic}-${connection_name}` for you at subscribe time.
  # ---------------------------------------------------------------------------
  queues:
    # RPC/handle backing queue (request/response or plain consume).
    - name: rlb-acl
      exchange: rlb
      routingKey: rlb-acl
      createQueueIfNotExists: true
      options:
        durable: true
        autoDelete: false
        # -----------------------------------------------------------------------
        # Growth bounds — RECOMMENDED on every work queue: without them, producers
        # outpacing consumers grow the queue unbounded until RabbitMQ's memory/disk
        # alarms BLOCK ALL PUBLISHERS (which freezes gateway `event` paths too).
        #   messageTtl  ms a message may wait before being dropped/dead-lettered
        #   maxLength   cap on queued messages (default overflow: drop-head = shed oldest)
        #   expires     delete the QUEUE itself after ms of no consumers/use
        # ⚠️ RabbitMQ refuses to re-declare an EXISTING queue with different
        # arguments (406 PRECONDITION_FAILED → the channel closes in a loop).
        # Adding these to an already-deployed queue requires deleting it first
        # (or a queue policy set broker-side, which avoids the redeclare entirely).
        # messageTtl: 3600000
        # maxLength: 100000
        exclusive: false
    - name: rlb-gateway-admin
      exchange: rlb
      routingKey: rlb-gateway-admin
      createQueueIfNotExists: true
      options:
        durable: true
    # Inspection queue for exhausted messages (broker.retry.deadLetter above).
    # `#` catches every original routing key. NO topic consumes it: dead letters are
    # audited/replayed from the management UI. Bounded on purpose — it is a parking
    # lot, and an unbounded one eventually trips the broker's disk alarm.
    # ⚠️ Do NOT give this queue a deadLetterExchange pointing back at `rlb-dlx`:
    # messageTtl expiry would re-enqueue everything here in a permanent cycle.
    - name: rlb-dead-letters
      exchange: rlb-dlx
      routingKey: '#'
      createQueueIfNotExists: true
      options:
        durable: true
        autoDelete: false
        exclusive: false
        # maxLength: 50000

  # ---------------------------------------------------------------------------
  # replyQueues — OPTIONAL. `{ [exchangeName]: replyQueueName }`. By default RPC
  # uses RabbitMQ direct-reply-to (a fast per-request pseudo-queue). Map a fixed
  # reply queue per exchange here to use that instead; when an entry exists for
  # the request's exchange, its replyTo is used. Leave commented to use
  # direct-reply-to.
  # ---------------------------------------------------------------------------
  # replyQueues:
  #   rlb: rlb-reply

# =============================================================================
# topics: — BrokerTopic[]. The second forRoot argument.
# Each topic names a logical channel and binds it to one of FOUR modes. The mode
# decides how the broker wires it and what the decorators / BrokerService do.
#
# Common fields:
#   name          logical topic name. For built-in modules this MUST equal the
#                 decorator-bound constant; for your own topics, your choice.
#   mode          rpc | event | broadcast | handle.
#   queue         queue name (rpc / handle).
#   exchange      exchange name.
#   routingKey    routing key (broadcast / topic exchanges).
#   errorBehavior LEGACY per-topic override of defaultSubscribeErrorBehavior
#                 (decorator path): ack | nack | requeue. NO default — when unset,
#                 `retry` applies (topic-level, then broker-level, then the built-in
#                 5 attempts → drop). Prefer `retry`; `requeue` in particular
#                 nack-requeues forever with no attempt counter (poison-message hot
#                 loop) AND overrides broker.retry for the topic that declares it.
#   retry         per-topic retry policy, same shape as broker.retry. Wins over
#                 errorBehavior and over broker.retry.
#   mandatory     publish with AMQP `mandatory` (unroutable => returned).
#                 Default: false. Applies to event/broadcast and the rpc request.
#   persistent    publish with delivery-mode 2 (survives broker restart IF the
#                 target queue is durable). Default: false.
#   toObservable  (handle only) stream incoming messages onto
#                 BrokerService.events$ instead of a handler fn. Default: false.
# =============================================================================
topics:
  # --- 1) rpc -----------------------------------------------------------------
  # WHEN: request/response. The microservice registers an RPC consumer on
  # `queue`; callers use requestData() and await a reply. This is ALSO the mode
  # used by decorator-discovered @BrokerAction handlers. Requires queue or
  # exchange.
  - name: rlb-acl
    mode: rpc
    queue: rlb-acl
    exchange: rlb
    routingKey: rlb-acl
    # errorBehavior: ack     # optional per-topic override
    # persistent: false      # optional
    # mandatory: false       # optional

  # --- 2) event ---------------------------------------------------------------
  # WHEN: fire-and-forget publish. No consumer is asserted for the topic itself;
  # you publish to its exchange/routingKey with publishMessage() and the broker
  # delivers it to whatever is bound. The publish resolves on publisher-confirm
  # (broker accepted it), NOT when something consumes it.
  - name: audit
    mode: event
    exchange: rlb
    routingKey: audit
    # mandatory: true        # optional: get unroutable messages returned

  # --- 3) handle --------------------------------------------------------------
  # WHEN: a durable consumer that runs a handler with NO reply. Looks up `queue`
  # (+ its exchange/routingKey) and subscribes via registerHandler(); or set
  # toObservable: true to stream onto BrokerService.events$ instead.
  - name: notifications
    mode: handle
    queue: notifications
    exchange: rlb
    routingKey: notifications
    toObservable: false      # true => emit onto events$ instead of a handler fn

  # --- 4) broadcast -----------------------------------------------------------
  # WHEN: fan-out so EVERY running instance gets its own copy (e.g. the gateway's
  # runtime route-reload control topic). The consumer asserts a PER-INSTANCE
  # queue named `${topic}-${connection_name}` bound to exchange/routingKey.
  # REQUIRES a DISTINCT connection_name per instance (set under
  # connectionManagerOptions.connectionOptions.clientProperties.connection_name,
  # or promoted from routeDiscovery.serviceName) — the broker throws on boot if
  # connection_name is missing. NOTE: rlb-gateway-control is a decorator-bound
  # topic name and is NOT renamable when consuming the built-in gateway module.
  - name: rlb-gateway-control
    mode: broadcast
    exchange: rlb
    routingKey: rlb-gateway-control
