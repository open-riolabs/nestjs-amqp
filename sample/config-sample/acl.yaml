    ***REMOVED*** --- ACL grants (per-user; companyId/resourceId optional; userId + roles required) ---
    ***REMOVED*** acl-grant / acl-revoke are dual ops on the single (userId, companyId, resourceId)
    ***REMOVED*** record. GATED: the caller (from the forwarded X-GTW-AUTH-USERID header) must hold
