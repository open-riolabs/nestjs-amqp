***REMOVED*** NOTE — decorator-bound vs configurable, one more time
***REMOVED*** -----------------------------------------------------------------------------
***REMOVED*** The topic NAMES rlb-acl / rlb-gateway-admin / rlb-gateway-control and ALL
***REMOVED*** action strings (gw-path-*, gw-auth-*, gw-metrics-*, gw-health, gw-reload) are
***REMOVED*** decorator-bound and NOT configurable — write them exactly as shown. Only the
***REMOVED*** broker exchange/queue/routingKey and the route-discovery exchange/queue are
***REMOVED*** configurable, and the route-discovery exchange/queue must match on BOTH the
***REMOVED*** publisher (broker.routeDiscovery) and consumer (GatewayAdminModule
***REMOVED*** routeDiscovery) sides.
