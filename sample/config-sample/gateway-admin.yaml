# =============================================================================
# gateway-admin.yaml  —  annotated REFERENCE for the @open-rlb/nestjs-amqp
#                        gateway-admin module
# -----------------------------------------------------------------------------
# This file is documentation, not a drop-in config. It shows the fragments you
# add to a gateway's config.yaml to drive the gateway-admin management plane at
# runtime. All fragments are valid YAML and mirror the real sample at
#   sample/config-sample/gateway-db/config/config.yaml
#
# WHAT THE GATEWAY-ADMIN MODULE GIVES YOU
# ---------------------------------------
#   * DB-stored HTTP routes  — id-keyed CRUD via the gw-path-* actions. The
#     gw-path-export responder feeds gateway.loadConfig.paths so DB routes are
#     merged with the YAML gateway.paths on boot and on every reload.
#   * Stored auth-providers  — name-keyed PUT-upsert via the gw-auth-* actions.
#     There is NO POST: a single PUT creates-or-updates by `name` (upsertByName).
#     These are the DB-stored providers, on top of the static auth-providers[]
#     you declare in YAML.
#   * Metrics                — gw-metrics-get (rolling counters per route),
#     gw-metrics-series (bucketed time-series), gw-metrics-points (raw points,
#     newest first) and gw-metrics-track (a fire-and-forget per-call event sink,
#     mode: event). Plus gw-health, a tiny { status: 'ok' } liveness probe for
#     /health (a real 200, not a metrics dump).
#   * gw-reload              — the ONLY control action that forces the gateway to
#     rebuild its HTTP routes. It is published to the rlb-gateway-control
#     BROADCAST topic (gateway.reloadTopic); the control-topic subscriber ignores
#     everything except gw-reload, so a forced reload stays decoupled from any
#     other control traffic.
#   * Route auto-discovery   — a microservice announces its own HTTP routes to
#     the gateway (no YAML edits). Publisher side + consumer side; see below.
#
# WHAT IS FIXED vs WHAT IS CONFIGURABLE
# -------------------------------------
#   FIXED (decorator-bound, NOT configurable):
#     - the topic NAME  rlb-gateway-admin  (GATEWAY_ADMIN_TOPIC)
#     - the control topic action  gw-reload  (GW_RELOAD_ACTION)
#     - every action string: gw-path-*, gw-auth-*, gw-metrics-*, gw-health
#       (these come from GW_ADMIN_ACTIONS and must be written EXACTLY).
#   CONFIGURABLE:
#     - each topic's exchange / queue / routingKey (broker wiring)
#     - the route-discovery exchange / queue (publisher AND consumer sides),
#       defaulting to  rlb-route-discovery  /  rlb-route-sync .
# =============================================================================


# -----------------------------------------------------------------------------
# 1) Declare the broker topic + queue for the gateway-admin handlers
# -----------------------------------------------------------------------------
# The gateway-admin handlers consume from a topic that MUST be named literally
# rlb-gateway-admin (GATEWAY_ADMIN_TOPIC). The exchange / queue / routingKey are
# yours to choose; the topic NAME is not.
broker:
  # ... your uri, exchanges, connectionManagerOptions, etc. ...

  queues:
    # Durable queue consumed by the gateway-admin backend handlers.
    - name: rlb-gateway-admin
      exchange: rlb
      routingKey: rlb-gateway-admin
      createQueueIfNotExists: true
      options:
        durable: true

topics:
  # Topic the gateway-admin @BrokerAction handlers bind to.
  # name MUST be 'rlb-gateway-admin' (GATEWAY_ADMIN_TOPIC) — not configurable.
  - name: rlb-gateway-admin
    mode: rpc
    queue: rlb-gateway-admin
    exchange: rlb
    routingKey: rlb-gateway-admin

  # Broadcast control topic the gateway subscribes to (per-instance queue) and
  # rebuilds its routes on. gw-reload is published here. The NAME below is your
  # choice — it just has to match gateway.reloadTopic and the gw-reload path's
  # `topic`. (rlb-gateway-control is the convention used by the samples.)
  - name: rlb-gateway-control
    mode: broadcast
    exchange: rlb
    routingKey: rlb-gateway-control


# -----------------------------------------------------------------------------
# 2) The gateway.paths[] that expose gateway-admin over HTTP
# -----------------------------------------------------------------------------
# Action strings below MUST match GW_ADMIN_ACTIONS exactly (and gw-reload from
# GW_RELOAD_ACTION). The HTTP method/path/dataSource are yours to choose; these
# mirror the real sample config. `topic` is rlb-gateway-admin for every action
# EXCEPT gw-reload, which targets the broadcast control topic.
gateway:
  mode: gateway

  paths:
    # --- health → gw-health (tiny { status:'ok' } liveness probe) ------------
    - name: health
      method: GET
      path: /health
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-health
      mode: rpc

    # --- Route management: gw-path-* (id-keyed CRUD) -------------------------
    # gw-path-create is a POST (DB paths DO have an id) — unlike the name-keyed
    # auth-provider / ACL resources which are PUT-upserts.
    - name: gw-path-create # body requires name, method, path, topic; 409 on (method,path) collision
      method: POST
      path: /admin/paths
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-path-create
      mode: rpc
    - name: gw-path-list # paginated: ?page=&limit=
      method: GET
      path: /admin/paths
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-path-list
      mode: rpc
    - name: gw-path-search # query: ?q=&limit=
      method: GET
      path: /admin/paths/search
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-path-search
      mode: rpc
    - name: gw-path-export # enabled paths, ordered static-before-param; used by loadConfig.paths
      method: GET
      path: /admin/paths/export
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-path-export
      mode: rpc
    - name: gw-path-update # body: { id, name, method, path, topic, action, mode, ... }
      method: PUT
      path: /admin/paths
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-path-update
      mode: rpc
    - name: gw-path-get # query: ?id=
      method: GET
      path: /admin/paths/get
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-path-get
      mode: rpc
    - name: gw-path-delete # body: { id }
      method: DELETE
      path: /admin/paths
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-path-delete
      mode: rpc
    - name: gw-route-log-list # who changed what (actor=system | userId); query: ?limit=
      method: GET
      path: /admin/route-log
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-route-log-list
      mode: rpc
    - name: gw-route-log-search # ?actor=&service=&event=&routeKey=&from=&to=&page=&limit=
      method: GET
      path: /admin/route-log/search
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-route-log-search
      mode: rpc

    # --- Auth-provider management: gw-auth-* (name-keyed PUT-upsert, NO POST) -
    - name: gw-auth-list # paginated: ?page=&limit=
      method: GET
      path: /admin/auth
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-auth-list
      mode: rpc
    - name: gw-auth-search # query: ?q=&limit=
      method: GET
      path: /admin/auth/search
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-auth-search
      mode: rpc
    - name: gw-auth-upsert # PUT creates-or-updates by name. body: { name, type, ... }
      method: PUT
      path: /admin/auth
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-auth-update
      mode: rpc
    - name: gw-auth-get # query: ?name=
      method: GET
      path: /admin/auth/get
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-auth-get
      mode: rpc
    - name: gw-auth-delete # body: { name }
      method: DELETE
      path: /admin/auth
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-auth-delete
      mode: rpc
    # gw-auth-export also exists (dump all enabled providers); not exposed here.

    # --- Metrics: gw-metrics-* + gw-health ----------------------------------
    - name: gw-metrics-get # counters per route (count, errorCount, avgDurationMs); ?route= to filter
      method: GET
      path: /admin/metrics
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-metrics-get
      mode: rpc
    - name: gw-metrics-series # bucketed time-series: ?bucketMs=60000&from=&to=&method=&route=&name=
      method: GET
      path: /admin/metrics/series
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-metrics-series
      mode: rpc
    - name: gw-metrics-points # raw points, newest first: ?method=&route=&from=&to=&limit=
      method: GET
      path: /admin/metrics/points
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-metrics-points
      mode: rpc
    - name: gw-metrics-summary # dashboard overview (totals, percentiles, status breakdown, top-N)
      method: GET
      path: /admin/metrics/summary
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-metrics-summary
      mode: rpc
    - name: gw-metrics-prometheus # Prometheus exposition text (returned raw, not JSON-wrapped)
      method: GET
      path: /admin/metrics/prometheus
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-metrics-prometheus
      mode: rpc
      # Force a raw text/plain reply (the gateway returns the body verbatim, not JSON).
      headers:
        Content-Type: text/plain; version=0.0.4
    - name: gw-metrics-rollups # persisted downsampled rollup series: ?granularityMs=&from=&to=&method=&route=
      method: GET
      path: /admin/metrics/rollups
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-metrics-rollups
      mode: rpc
    - name: gw-metrics-track # fire-and-forget per-call event sink (mode: event)
      method: POST
      path: /admin/metrics/track
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-metrics-track
      mode: event

    # --- gw-reload → rlb-gateway-control (broadcast) -------------------------
    # The ONLY action that forces a route rebuild. Note topic = the broadcast
    # control topic (NOT rlb-gateway-admin), and mode: event (fire-and-forget).
    - name: gw-reload
      method: POST
      path: /admin/reload
      dataSource: body
      topic: rlb-gateway-control
      action: gw-reload
      mode: event
    - name: gw-auth-reload # deliberate: reload DB auth-providers into RAM (separate from gw-reload)
      method: POST
      path: /admin/auth/reload
      dataSource: body
      topic: rlb-gateway-control
      action: gw-auth-reload
      mode: event

  # Load DB-stored routes (in addition to gateway.paths above) on boot and on
  # every reload by pointing loadConfig.paths at the gw-path-export responder.
  loadConfig:
    paths:
      topic: rlb-gateway-admin
      action: gw-path-export

  # The broadcast topic gw-reload is published to. Must match the topic NAME of
  # the broadcast control topic and the gw-reload path's `topic` above.
  reloadTopic: rlb-gateway-control

  # Auto-emit a gw-metrics-track event after every served request. You normally
  # never call gw-metrics-track by hand — this wires the gateway to do it.
  metrics:
    topic: rlb-gateway-admin
    action: gw-metrics-track


# =============================================================================
# 3) Route auto-discovery — PUBLISHER side (microservice -> gateway)
# -----------------------------------------------------------------------------
# A microservice announces its own HTTP routes (its @BrokerHTTP / @BrokerAction
# metadata) to the gateway, which persists + registers them — no YAML edits on
# the gateway. The publisher (RouteDiscoveryPublisherService) lives in the
# BROKER module, so its config lives INSIDE the broker block as
# broker.routeDiscovery.
#
#   serviceName    Required to publish. The ownership key for this service's
#                  routes. Also PROMOTES to the AMQP connection_name when no
#                  connection_name is set explicitly.
#   publishOnBoot  Announce the manifest automatically on bootstrap (default
#                  true). The manifest is published as a durable, persistent
#                  message, so the durable queue buffers it even if no gateway
#                  consumer is up yet.
#   exchange       Fanout exchange the manifest is published to.
#                  Default rlb-route-discovery (ROUTE_DISCOVERY_EXCHANGE).
#   queue          Durable shared work-queue the gateway(s) consume from
#                  (competing consumers). Default rlb-route-sync (ROUTE_SYNC_QUEUE).
#
# Override exchange/queue only to namespace route-discovery per environment or
# cluster on a shared broker — and then set the SAME values on the gateway's
# consumer side (section 4). This fragment belongs in the MICROSERVICE's
# config.yaml, not the gateway's.
# =============================================================================
#
# broker:
#   name: "rabbitmq"
#   uri: "amqp://localhost:5672/"
#   # ... exchanges, queues, this service's own topic ...
#   routeDiscovery:
#     serviceName: demo-ms        # required; also fills connection_name if unset
#     publishOnBoot: true         # default true
#     exchange: rlb-route-discovery   # default; override only to namespace per env
#     queue: rlb-route-sync           # default; must match the gateway consumer


# =============================================================================
# 4) Route auto-discovery — CONSUMER side (gateway <- microservice)
# -----------------------------------------------------------------------------
# The consumer (RouteSyncService) is wired by GatewayAdminModule, NOT by YAML.
# On bootstrap it asserts the fanout exchange and subscribes to the durable
# queue (competing consumers — one gateway instance processes each manifest),
# diffs each manifest against the DB scoped to the publishing service, applies
# only what changed, journals every change, and publishes gw-reload when
# anything changed.
#
# You configure the consumer's exchange/queue in NEST code, via
# GatewayAdminModule.forRoot / forRootAsync's routeDiscovery { exchange, queue }.
# These MUST MATCH the publishers' broker.routeDiscovery values
# (defaults rlb-route-discovery / rlb-route-sync). The consumer has NO
# serviceName — the gateway only receives manifests and keeps its own
# connection_name.
#
#   // forRootAsync example (resolve names from config):
#   GatewayAdminModule.forRootAsync({
#     imports: [ConfigModule],
#     inject: [ConfigService],
#     useFactory: (config: ConfigService) => ({
#       routeDiscovery: {
#         exchange: config.get('routeDiscovery.exchange'), // default rlb-route-discovery
#         queue:    config.get('routeDiscovery.queue'),    // default rlb-route-sync
#       },
#     }),
#     providers: [ /* HttpPathRepository, AuthProviderRepository,
#                     HttpMetricRepository, RouteSyncLogRepository bindings */ ],
#   })
#
# If you DO surface those names in the gateway's YAML (so the forRootAsync
# factory can read them), a plain top-level block like the one below works.
# Keep these identical to every publisher's broker.routeDiscovery.exchange/queue.
# =============================================================================
#
# routeDiscovery:
#   exchange: rlb-route-discovery   # default; MUST match the publishers
#   queue: rlb-route-sync           # default; MUST match the publishers


# =============================================================================
# NOTE — decorator-bound vs configurable, one more time
# -----------------------------------------------------------------------------
# The topic NAMES rlb-acl / rlb-gateway-admin / rlb-gateway-control and ALL
# action strings (gw-path-*, gw-auth-*, gw-metrics-*, gw-health, gw-reload) are
# decorator-bound and NOT configurable — write them exactly as shown. Only the
# broker exchange/queue/routingKey and the route-discovery exchange/queue are
# configurable, and the route-discovery exchange/queue must match on BOTH the
# publisher (broker.routeDiscovery) and consumer (GatewayAdminModule
# routeDiscovery) sides.
# =============================================================================
