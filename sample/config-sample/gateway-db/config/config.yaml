app:
  port: 80
  host: 0.0.0.0
  environment: "development"

data-mongodb:
  protocol: mongodb
  host:
    - REDACTED-MONGO-HOST:27018
    - REDACTED-MONGO-HOST:27019
    - REDACTED-MONGO-HOST:27020
  user: REDACTED-MONGO-USER
  password: REDACTED-MONGO-PASSWORD
  database: tfr-gateway
  auth: true
  options:
    replicaSet: rs0
    authSource: admin
    readPreference: primary

influx:
  url: https://REDACTED-INFLUX-HOST
  token: REDACTED-INFLUX-TOKEN
  org: sicily-action
  orgID: e6cef0c3225ee70d
  bucket: gtw-test

auth-providers:
  - name: transfeero-affiliate-jwks
    type: jwks
    jwtMap:
      - sub:userId
      - email:email
      - roles:roles
      - name:name
      - username:username
    rolesClaim: roles
    headerPrefix: "X-GTW-AUTH-"
    outProp: $auth
    issuer: https://login.transfeero.com/realms/transfeero-dev
    tokenUrl: https://login.transfeero.com/realms/transfeero-dev/protocol/openid-connect/token
    jwksUri: https://login.transfeero.com/realms/transfeero-dev/protocol/openid-connect/certs
    algorithms:
      - RS256
    clientId: admin
    scopes:
      - openid
      - profile
  - name: transfeero-admin-jwks
    type: jwks
    jwtMap:
      - sub:userId
      - email:email
      - roles:roles
      - name:name
      - username:username
    rolesClaim: roles
    headerPrefix: "X-GTW-AUTH-"
    outProp: $auth
    issuer: https://login.transfeero.com/realms/transfeero-dev
    tokenUrl: https://login.transfeero.com/realms/transfeero-dev/protocol/openid-connect/token
    jwksUri: https://login.transfeero.com/realms/transfeero-dev/protocol/openid-connect/certs
    algorithms:
      - RS256
    clientId: admin
    scopes:
      - openid
      - profile
  - name: transfeero-customer-jwks
    type: jwks
    jwtMap:
      - sub:userId
      - email:email
      - roles:roles
      - name:name
      - username:username
    rolesClaim: roles
    headerPrefix: "X-GTW-AUTH-"
    outProp: $auth
    issuer: https://login.transfeero.com/realms/transfeero-dev
    tokenUrl: https://login.transfeero.com/realms/transfeero-dev/protocol/openid-connect/token
    jwksUri: https://login.transfeero.com/realms/transfeero-dev/protocol/openid-connect/certs
    algorithms:
      - RS256
    clientId: admin
    scopes:
      - openid
      - profile
  - name: transfeero-partner-jwks
    type: jwks
    jwtMap:
      - sub:userId
      - email:email
      - roles:roles
      - name:name
      - username:username
    rolesClaim: roles
    headerPrefix: "X-GTW-AUTH-"
    outProp: $auth
    issuer: https://login.transfeero.com/realms/transfeero-dev
    tokenUrl: https://login.transfeero.com/realms/transfeero-dev/protocol/openid-connect/token
    jwksUri: https://login.transfeero.com/realms/transfeero-dev/protocol/openid-connect/certs
    algorithms:
      - RS256
    clientId: admin
    scopes:
      - openid
      - profile
  - name: transfeero-int-cmp-1
    type: str-compare
    rolesClaim: roles
    headerPrefix: "X-GTW-AUTH-"
    outProp: $auth
    secret: your-secret
  - name: transfeero-nino-key
    type: str-compare
    rolesClaim: roles
    headerPrefix: "X-GTW-AUTH-"
    outProp: $auth
    secret: REDACTED-AUTH-SECRET-NINO
  - name: transfeero-nino-partner-verify-key
    type: str-compare
    rolesClaim: roles
    headerPrefix: "X-GTW-AUTH-"
    outProp: $auth
    secret: REDACTED-AUTH-SECRET-NINO-PARTNER

broker:
  name: "rabbitmq"
  uri: "amqp://REDACTED-AMQP-HOST:5672/"
  defaultSubscribeErrorBehavior: "ack"
  defaultPublishErrorBehavior: "reject"
  connectionManagerOptions:
    heartbeatIntervalInSeconds: 60
    reconnectTimeInSeconds: 60
    connectionOptions:
      clientProperties:
        connection_name: "gateway"
      credentials:
        mechanism: PLAIN
        username: guest
        password: guest
  exchanges:
    - name: tfr-gateway
      type: direct
      createExchangeIfNotExists: true
      options:
        durable: true

  queues:
    - name: rlb-acl
      exchange: tfr-gateway
      routingKey: rlb-acl
      createQueueIfNotExists: true
      options:
        durable: true
    - name: rlb-gateway-admin
      exchange: tfr-gateway
      routingKey: rlb-gateway-admin
      createQueueIfNotExists: true
      options:
        durable: true

