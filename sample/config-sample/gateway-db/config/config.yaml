gateway:
  mode: gateway
  reloadTopic: tfr-gateway-control
  loadConfig:
    paths:
      topic: rlb-gateway-admin
      action: gw-path-export
  metrics:
    topic: rlb-gateway-admin
    action: gw-metrics-track

  paths:
