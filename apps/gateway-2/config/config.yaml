app:
  port: 3000
  host: 0.0.0.0
  environment: development

***REMOVED*** This example keeps ACL/gateway-admin data fully in RAM (in-memory repositories) and the
***REMOVED*** ACL L2 cache in RAM too — no Mongo/Redis needed. Only RabbitMQ is required.

broker:
  name: "rabbitmq"
  uri: "amqp://REDACTED-AMQP-HOST:5672/riolabs-dev"
  defaultSubscribeErrorBehavior: "ack"
  defaultPublishErrorBehavior: "reject"
  connectionManagerOptions:
    heartbeatIntervalInSeconds: 60
    reconnectTimeInSeconds: 60
    connectionOptions:
      clientProperties:
        connection_name: "riolabs-chatbot"
      credentials:
        mechanism: PLAIN
        username: REDACTED
        password: REDACTED

  exchanges:
    - name: rlb
      type: direct
      createExchangeIfNotExists: true
      options:
        durable: true

  queues:
    ***REMOVED*** Queue consumed by the ACL backend handlers (AclService / AclManagementService).
    - name: rlb-acl
      exchange: rlb
      routingKey: rlb-acl
      createQueueIfNotExists: true
      options:
        durable: true
    ***REMOVED*** Queue consumed by the gateway-admin backend handlers.
    - name: rlb-gateway-admin
      exchange: rlb
      routingKey: rlb-gateway-admin
      createQueueIfNotExists: true
      options:
        durable: true

  ***REMOVED*** replyQueues:
  ***REMOVED***   rlb: rlb-reply

topics:
  ***REMOVED*** Topic the @BrokerAction handlers of the ACL module bind to (ACL_TOPIC = 'rlb-acl').
  - name: rlb-acl
    mode: rpc
    queue: rlb-acl
    exchange: rlb
    routingKey: rlb-acl
  ***REMOVED*** Topic the gateway-admin handlers bind to (GATEWAY_ADMIN_TOPIC = 'rlb-gateway-admin').
  - name: rlb-gateway-admin
    mode: rpc
    queue: rlb-gateway-admin
    exchange: rlb
    routingKey: rlb-gateway-admin
  ***REMOVED*** Broadcast control topic: the gateway subscribes (per-instance queue) and rebuilds its
  ***REMOVED*** Express routes at runtime when a message arrives. A direct exchange + same routingKey
  ***REMOVED*** fans out to every instance's queue (each instance needs a distinct connection_name).
  - name: rlb-gateway-control
    mode: broadcast
    exchange: rlb
    routingKey: rlb-gateway-control

auth-providers:
  - name: gateway-jwks
    type: jwks
    jwtMap:
      - sub:userId
      - email:email
      - preferred_username:username
      - roles:roles
    rolesClaim: roles
    headerPrefix: "X-GTW-AUTH-"
    uidClaim: USERID
    usernameClaim: USERNAME
    outProp: $auth
    issuer: https://login.riolabs.net/realms/riolabs-dev
    tokenUrl: https://login.riolabs.net/realms/riolabs-dev/protocol/openid-connect/token
    jwksUri: https://login.riolabs.net/realms/riolabs-dev/protocol/openid-connect/certs
    algorithms:
      - RS256
    clientId: chattoo
    ***REMOVED***clientSecret:
    ***REMOVED***audience:
    scopes:
      - openid
      - profile

gateway:
  mode: gateway
  paths:
    ***REMOVED*** --- health ---
    - name: health
      method: GET
      path: /health
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-metrics-get
      mode: rpc

    ***REMOVED*** --- ACL management: actions (full CRUD) ---
    - name: acl-action-create
      method: POST
      path: /acl/actions
      dataSource: body
      topic: rlb-acl
      action: acl-action-create
      mode: rpc
    - name: acl-action-list
      method: GET
      path: /acl/actions
      dataSource: query
      topic: rlb-acl
      action: acl-action-list
      mode: rpc
    - name: acl-action-update     ***REMOVED*** body: { id, name?, description? }
      method: PUT
      path: /acl/actions
      dataSource: body
      topic: rlb-acl
      action: acl-action-update
      mode: rpc
    - name: acl-action-delete     ***REMOVED*** body: { id }
      method: DELETE
      path: /acl/actions
      dataSource: body
      topic: rlb-acl
      action: acl-action-delete
      mode: rpc

    ***REMOVED*** --- ACL management: roles (full CRUD + get) ---
    - name: acl-role-create
      method: POST
      path: /acl/roles
      dataSource: body
      topic: rlb-acl
      action: acl-role-create
      mode: rpc
    - name: acl-role-list
      method: GET
      path: /acl/roles
      dataSource: query
      topic: rlb-acl
      action: acl-role-list
      mode: rpc
    - name: acl-role-get          ***REMOVED*** query: ?name=
      method: GET
      path: /acl/roles/get
      dataSource: query
      topic: rlb-acl
      action: acl-role-get
      mode: rpc
    - name: acl-role-update       ***REMOVED*** body: { name, actions?, description? }
      method: PUT
      path: /acl/roles
      dataSource: body
      topic: rlb-acl
      action: acl-role-update
      mode: rpc
    - name: acl-role-delete       ***REMOVED*** body: { name }
      method: DELETE
      path: /acl/roles
      dataSource: body
      topic: rlb-acl
      action: acl-role-delete
      mode: rpc

    ***REMOVED*** --- ACL grants (per-user; resourceId optional) ---
    - name: acl-grant
      method: POST
      path: /acl/grants
      dataSource: body
      topic: rlb-acl
      action: acl-grant
      mode: rpc
    - name: acl-revoke
      method: DELETE
      path: /acl/grants
      dataSource: body
      topic: rlb-acl
      action: acl-revoke
      mode: rpc

    ***REMOVED*** --- ACL checks (exposed over HTTP for the demo; normally called over the broker) ---
    ***REMOVED*** Gateway-style primary filter {userId, roles}: true if the user holds at least one role.
    - name: acl-check-gtw
      method: POST
      path: /acl/check
      dataSource: body
      topic: rlb-acl
      action: acl-can-user-do-gtw
      mode: rpc
    ***REMOVED*** MS-side resource-scoped check {userId, roles, resource}: true if a global grant OR a
    ***REMOVED*** grant bound to that resource gives the user a role.
    - name: acl-check-resource
      method: POST
      path: /acl/check-resource
      dataSource: body
      topic: rlb-acl
      action: acl-can-user-do
      mode: rpc
    ***REMOVED*** Authenticated: lists the caller's accessible resources (grouped by business resource).
    ***REMOVED*** Reads userId from the forwarded X-GTW-AUTH-USERID header → needs `auth` (no roles).
    - name: acl-list-resources-by-user
      method: GET
      path: /acl/resources
      dataSource: query
      topic: rlb-acl
      action: acl-list-resources-by-user
      mode: rpc
      auth: gateway-jwks
    ***REMOVED*** Raw list of a user's grants. body: { userId }
    - name: acl-list-by-user
      method: POST
      path: /acl/by-user
      dataSource: body
      topic: rlb-acl
      action: acl-list-by-user
      mode: rpc
    ***REMOVED*** Action check scoped to a resource. body: { userId, resourceId, action, resourceBusinessId? }
    - name: acl-verify-access
      method: POST
      path: /acl/verify
      dataSource: body
      topic: rlb-acl
      action: acl-verify-access
      mode: rpc

    ***REMOVED*** --- gateway-admin: manage DB routes / auth-providers / metrics ---
    - name: gw-path-create
      method: POST
      path: /admin/paths
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-path-create
      mode: rpc
    - name: gw-path-list
      method: GET
      path: /admin/paths
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-path-list
      mode: rpc
    - name: gw-path-export
      method: GET
      path: /admin/paths/export
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-path-export
      mode: rpc
    - name: gw-path-delete
      method: DELETE
      path: /admin/paths
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-path-delete
      mode: rpc
    - name: gw-auth-create
      method: POST
      path: /admin/auth
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-auth-create
      mode: rpc
    - name: gw-auth-list
      method: GET
      path: /admin/auth
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-auth-list
      mode: rpc
    - name: gw-auth-delete
      method: DELETE
      path: /admin/auth
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-auth-delete
      mode: rpc
    - name: gw-metrics-get
      method: GET
      path: /admin/metrics
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-metrics-get
      mode: rpc
    - name: gw-metrics-track
      method: POST
      path: /admin/metrics/track
      dataSource: body
      topic: rlb-gateway-admin
      action: gw-metrics-track
      mode: event
    - name: gw-reload
      method: POST
      path: /admin/reload
      dataSource: body
      topic: rlb-gateway-control
      action: gw-reload
      mode: event

    ***REMOVED*** --- PROTECTED demo: Keycloak JWT + roles → gateway role filter (canUserDoGtw) ---
    ***REMOVED*** `roles` lists ROLE names now: the gateway passes if the user holds AT LEAST ONE of them.
    - name: protected-resource
      method: GET
      path: /protected
      dataSource: query
      topic: rlb-gateway-admin
      action: gw-metrics-get
      mode: rpc
      auth: gateway-jwks
      roles: [user, admin]

  ***REMOVED*** Routes managed in the DB are loaded (ordered static-before-param) at boot AND on every
  ***REMOVED*** runtime reload, in addition to the YAML ones above. Seed via POST /admin/paths then
  ***REMOVED*** POST /admin/reload (no restart needed).
  loadConfig:
    paths:
      topic: rlb-gateway-admin
      action: gw-path-export
  ***REMOVED*** Broadcast topic that triggers a runtime route rebuild (see topics: rlb-gateway-control).
  reloadTopic: rlb-gateway-control
  ***REMOVED*** Per-call metrics: the gateway auto-emits a track event after every request to the
  ***REMOVED*** gateway-admin metrics handler (GatewayMetricsService.track). No manual call needed.
  metrics:
    topic: rlb-gateway-admin
    action: gw-metrics-track
  events: []
