app:
  port: 3000
  host: 0.0.0.0
  environment: "development"

auth-providers: []

broker:
  name: "rabbitmq"
  uri: "amqp://localhost:5672/"

  # Bounded retry on handler failure. Being the least specific setting, it applies to every
  # topic that declares neither `retry` nor `errorBehavior`.
  # ⚠️ NEVER use `errorBehavior: requeue` (here as defaultSubscribeErrorBehavior, or on a
  # topic): it nack-requeues forever with no attempt counter and hot-loops the consumer —
  # and being MORE specific than this block, it silently disables it.
  # ⚠️ `deadLetter.exchange` must be a DEDICATED exchange: with no explicit routingKey the
  # dead-lettered copy keeps the message's ORIGINAL key, so reusing a work exchange routes
  # it straight back into the queue it just left (endless loop). Boot-time validation in
  # BrokerService reports both mistakes.
  retry:
    maxAttempts: 5             # total attempts, first delivery included
    delayMs: 5000              # 0 burns every attempt within the same millisecond of an outage
    onExhausted: dead-letter   # dead-letter | drop
    deadLetter:
      exchange: gtw.dlx        # NOT gtw.rpc / gtw.events / gtw.broadcast
  connectionManagerOptions:
    heartbeatIntervalInSeconds: 60
    reconnectTimeInSeconds: 60
    connectionOptions:
      clientProperties:
        connection_name: "whatsapp-gateway"
      credentials:
        mechanism: PLAIN
        username: guest
        password: guest

  exchanges:
    # Direct exchange used by RPC sample (1:1 routing on a known queue).
    - name: gtw.rpc
      type: "direct"
      createExchangeIfNotExists: true
      options:
        durable: true
        autoDelete: false
        internal: false
    # Topic exchange used by event sample (publish-subscribe with routing key).
    - name: gtw.events
      type: "topic"
      createExchangeIfNotExists: true
      options:
        durable: true
        autoDelete: false
        internal: false
    # Topic exchange used by broadcast sample. The per-instance queue
    # `broadcast.demo-<connection_name>` is asserted lazily by registerHandler()
    # at consumer startup and is now forced to `durable: true` by the lib.
    - name: gtw.broadcast
      type: "topic"
      createExchangeIfNotExists: true
      options:
        durable: true
        autoDelete: false
        internal: false
    # Dead-letter exchange for broker.retry. Dedicated on purpose: no work queue is bound
    # to it, so an exhausted message can never be routed back to its own queue.
    - name: gtw.dlx
      type: "topic"
      createExchangeIfNotExists: true
      options:
        durable: true
        autoDelete: false
        internal: false

  queues:
    # RPC queue: bound to gtw.rpc with the action routing key.
    - name: gtw.rpc.queue
      createQueueIfNotExists: true
      exchange: gtw.rpc
      routingKey: gtw.rpc.demo
      options:
        durable: true
        autoDelete: false
        exclusive: false
    # Event consumer queue: bound to gtw.events with the demo routing key.
    # Survives broker restarts; messages persist (publisher sends persistent).
    - name: gtw.events.queue
      createQueueIfNotExists: true
      exchange: gtw.events
      routingKey: gtw.events.demo
      options:
        durable: true
        autoDelete: false
        exclusive: false
    # Inspection queue for exhausted messages. Without a binding on gtw.dlx the broker
    # discards them and `onExhausted: dead-letter` behaves exactly like `drop`.
    # NO topic consumes this queue: read/replay it from the management UI.
    - name: gtw.dead-letters
      createQueueIfNotExists: true
      exchange: gtw.dlx
      routingKey: '#'
      options:
        durable: true
        autoDelete: false
        exclusive: false

topics:
  # `mandatory: true` makes the broker return unrouted publishes to the
  # publisher channel, where AmqpConnection logs them (RPC reply-to filtered).
  # ---- RPC ----------------------------------------------------------------
  # Used by both server (registerRpc) and client (requestData / HTTP proxy).
  - name: rpc.demo
    mode: rpc
    queue: gtw.rpc.queue
    exchange: gtw.rpc
    routingKey: gtw.rpc.demo
    mandatory: true

  # ---- EVENT (publisher side) --------------------------------------------
  # publishMessage('event.demo', ...) -> gtw.events / gtw.events.demo
  - name: event.demo
    mode: event
    exchange: gtw.events
    routingKey: gtw.events.demo
    mandatory: true

  # ---- EVENT (consumer side) ---------------------------------------------
  # registerHandler('event.demo.consumer', ...) -> consumes gtw.events.queue.
  - name: event.demo.consumer
    mode: handle
    queue: gtw.events.queue

  # ---- BROADCAST ---------------------------------------------------------
  # Same topic name is used by publisher and by each subscribing instance.
  - name: broadcast.demo
    mode: broadcast
    exchange: gtw.broadcast
    routingKey: gtw.broadcast.demo
    mandatory: true

  # ---- UNROUTABLE DEMO ---------------------------------------------------
  # Publishes to an existing exchange (`gtw.events`) using a routing key that
  # NO queue is bound to. With `mandatory: true`, the broker returns the
  # message to the publisher, which makes AmqpConnection's `'return'` listener
  # emit the "Unrouted message returned ..." WARN. Useful to verify the
  # detection path end-to-end (and to validate the alternate-exchange wiring
  # when `defaultAlternateExchange` is configured).
  - name: unroutable.demo
    mode: event
    exchange: gtw.events
    routingKey: void.no.binding
    mandatory: true

gateway:
  events: []
  mode: gateway
  paths:
    # HTTP -> RPC proxy. POST /demo/rpc translates to broker.requestData on
    # topic `rpc.demo` action `add`. The `add` action is registered by
    # RpcDemoService.add() via @BrokerAction (decorator pattern). Pass
    # a `multiply` variant by adding another path with `action: multiply`.
    - name: rpc-via-http
      method: POST
      dataSource: body
      path: /demo/rpc
      topic: rpc.demo
      action: add
      mode: rpc

    # HTTP -> Event proxy. POST /demo/event publishes on topic `event.demo`
    # and returns 202 immediately (fire-and-forget from the HTTP client's PoV,
    # but the publisher confirm is awaited internally by publishMessage).
    - name: event-via-http
      method: POST
      dataSource: body
      path: /demo/event
      topic: event.demo
      action: event.demo.action
      mode: event
